<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121214" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculator" />
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #121214; padding: 16px; }
    .calculator { background: #1f1f23; border-radius: 28px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
    .display { background: #121214; border-radius: 18px; padding: 20px; text-align: right; margin-bottom: 20px; min-height: 100px; display: flex; flex-direction: column; justify-content: flex-end; }
    .history { font-size: 1rem; color: #8b8b93; min-height: 1.2rem; }
    .current { font-size: 2.6rem; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    button { height: 64px; border-radius: 18px; border: none; font-size: 1.35rem; font-weight: 500; cursor: pointer; background: #2a2a30; color: #fff; transition: opacity 0.1s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.7; transform: scale(0.96); }
    button.operator { background: #ff9f0a; color: #fff; }
    button.action { background: #3e3e46; color: #e4e4e7; }
    button.span-two { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keypad">
      <button class="action" onclick="clearAll()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="action" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('÷')">÷</button>
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('×')">×</button>
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>
      <button onclick="appendNumber('0')" class="span-two">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    let cur = '0', prev = '', op = null, reset = false;
    const curD = document.getElementById('current'), histD = document.getElementById('history');
    function update() { curD.innerText = cur; histD.innerText = op ? `${prev} ${op}` : ''; }
    function appendNumber(n) { if (cur === '0' || reset) { cur = n; reset = false; } else { if (n === '.' && cur.includes('.')) return; cur += n; } update(); }
    function appendOperator(o) { if (op !== null && !reset) calculate(); prev = cur; op = o; reset = true; update(); }
    function calculate() {
      if (!op || reset) return;
      let a = parseFloat(prev), b = parseFloat(cur), res = 0;
      if (isNaN(a) || isNaN(b)) return;
      if (op === '+') res = a + b;
      else if (op === '-') res = a - b;
      else if (op === '×') res = a * b;
      else if (op === '÷') { if (b === 0) { alert("Cannot divide by 0"); clearAll(); return; } res = a / b; }
      else if (op === '%') res = a % b;
      cur = String(Math.round(res * 1e10) / 1e10); op = null; reset = true; update();
    }
    function clearAll() { cur = '0'; prev = ''; op = null; update(); }
    function deleteLast() { cur = cur.length <= 1 ? '0' : cur.slice(0, -1); update(); }
    window.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') appendNumber(e.key);
      if (['+', '-', '*', '/'].includes(e.key)) appendOperator(e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key);
      if (e.key === 'Enter' || e.key === '=') calculate();
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearAll();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
