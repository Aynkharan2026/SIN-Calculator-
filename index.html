<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121214" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SIN Calc" />
  <title>Canadian SIN Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #121214; padding: 16px; color: #fff; }
    .card { background: #1f1f23; border-radius: 28px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 1.1rem; font-weight: 600; color: #a1a1aa; margin-bottom: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
    
    .screen { background: #121214; border-radius: 18px; padding: 16px 12px; margin-bottom: 20px; min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .digits { display: flex; gap: 6px; font-size: 1.6rem; font-weight: 700; font-family: monospace; }
    .digit-box { width: 26px; height: 38px; background: #27272a; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; border: 1px solid #3f3f46; }
    .digit-box.gap { margin-right: 6px; }
    .digit-box.check-digit { background: #052e16; border-color: #22c55e; color: #4ade80; animation: pulse 0.3s ease; }
    .digit-box.invalid { background: #450a0a; border-color: #ef4444; color: #f87171; }
    
    .status { margin-top: 10px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }
    .text-green { color: #4ade80; }
    .text-red { color: #f87171; }
    .text-muted { color: #71717a; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    button { height: 56px; border-radius: 16px; border: none; font-size: 1.35rem; font-weight: 600; cursor: pointer; background: #2a2a30; color: #fff; -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.7; transform: scale(0.96); }
    button.action { background: #3e3e46; color: #e4e4e7; font-size: 1.1rem; }

    @keyframes pulse { 0% { transform: scale(0.85); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>SIN Check-Digit Calculator</h1>
    
    <div class="screen">
      <div class="digits" id="boxes"></div>
      <div class="status text-muted" id="status">Enter 8 digits...</div>
    </div>

    <div class="keypad">
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="action" onclick="clearAll()">C</button>
      <button onclick="press('0')">0</button>
      <button class="action" onclick="del()">⌫</button>
    </div>
  </div>

  <script>
    let input = "";

    function calculateLuhnCheckDigit(eightDigits) {
      let sum = 0;
      for (let i = 0; i < 8; i++) {
        let d = parseInt(eightDigits[i], 10);
        if (i % 2 === 1) { // 2nd, 4th, 6th, 8th digits
          d *= 2;
          if (d > 9) d -= 9;
        }
        sum += d;
      }
      return (10 - (sum % 10)) % 10;
    }

    function getRegion(firstDigit) {
      switch (firstDigit) {
        case '1': return 'Atlantic / Ontario (New series)';
        case '2': case '3': return 'Quebec';
        case '4': case '5': return 'Ontario';
        case '6': return 'Prairies & Territories (AB, MB, SK, NT, NU)';
        case '7': return 'Pacific (BC & Yukon)';
        case '9': return 'Temporary Resident (Work/Study Permit)';
        case '0': case '8': return 'Invalid prefix (0 and 8 are not used)';
        default: return '';
      }
    }

    function render() {
      const boxes = document.getElementById('boxes');
      const status = document.getElementById('status');
      boxes.innerHTML = '';

      let calculatedCheck = null;
      if (input.length >= 8) {
        calculatedCheck = calculateLuhnCheckDigit(input.slice(0, 8));
      }

      for (let i = 0; i < 9; i++) {
        const box = document.createElement('div');
        box.className = 'digit-box';
        if (i === 2 || i === 5) box.classList.add('gap');

        if (i < input.length) {
          box.innerText = input[i];
          if (i === 8) {
            if (parseInt(input[8], 10) === calculatedCheck) {
              box.classList.add('check-digit');
            } else {
              box.classList.add('invalid');
            }
          }
        } else if (i === 8 && input.length === 8) {
          // Auto-display calculated 9th digit
          box.innerText = calculatedCheck;
          box.classList.add('check-digit');
        } else {
          box.innerText = '·';
          box.style.color = '#52525b';
        }
        boxes.appendChild(box);
      }

      // Update status message
      const region = input.length > 0 ? getRegion(input[0]) : '';
      if (input.length < 8) {
        status.className = 'status text-muted';
        status.innerText = `Enter ${8 - input.length} more digit${8 - input.length > 1 ? 's' : ''}...`;
      } else if (input.length === 8) {
        status.className = 'status text-green';
        status.innerText = `9th Digit: ${calculatedCheck} • ${region}`;
      } else if (input.length === 9) {
        if (parseInt(input[8], 10) === calculatedCheck) {
          status.className = 'status text-green';
          status.innerText = `Valid SIN • ${region}`;
        } else {
          status.className = 'status text-red';
          status.innerText = `Invalid! 9th digit should be ${calculatedCheck}`;
        }
      }
    }

    function press(n) {
      if (input.length < 9) {
        input += n;
        render();
      }
    }

    function del() {
      input = input.slice(0, -1);
      render();
    }

    function clearAll() {
      input = '';
      render();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') press(e.key);
      if (e.key === 'Backspace') del();
      if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
    });

    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
